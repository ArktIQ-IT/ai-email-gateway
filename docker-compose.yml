    #   - "traefik.http.routers.ai-email-gateway.entrypoints=websecure"
    #   - "traefik.http.routers.ai-email-gateway.tls.certresolver=zerosslCloudflare"
    #   - "traefik.http.services.ai-email-gateway.loadbalancer.server.port=8000"
    # networks:
    #   - traefik
    restart: unless-stopped

